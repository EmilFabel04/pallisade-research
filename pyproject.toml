[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pallisade-research"
version = "0.1.0"
description = "Pallisade — cited research-intelligence platform (research, debate, agents, checks)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "pyyaml>=6.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "voyageai>=0.3.0",
    "anthropic>=0.40.0",
    "pgvector>=0.3.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.7.0",
    "cryptography>=44.0",
    "mcp>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.7",
    "reportlab>=4.0.0",
]

[tool.setuptools.packages.find]
include = [
    "tradingagents*",
    "pallisade_core*",
    "pallisade_connections*",
    "pallisade_research*",
    "pallisade_worker*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
asyncio_mode = "auto"
