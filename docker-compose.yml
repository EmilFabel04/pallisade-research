services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

  pallisade-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pallisade
      POSTGRES_PASSWORD: pallisade
      POSTGRES_DB: pallisade
    ports:
      - "5432:5432"
    volumes:
      - pallisade_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pallisade"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tradingagents_data:
  ollama_data:
  pallisade_db_data:
